# Configuracion de conexion a la base de datos PostgreSQL del proyecto Nemoralia.
# En despliegue (Render) estas variables se toman de las variables de entorno
# configuradas en el servicio; en local, se usan los valores por defecto indicados.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nemoralia_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto del servidor: Render inyecta la variable PORT automaticamente
server.port=${PORT:8083}
