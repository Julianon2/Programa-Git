# Configuracion de conexion a la base de datos MySQL (misma BD que AA2-EV01)
spring.datasource.url=jdbc:mysql://localhost:3307/nemoralia_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor embebido de Spring Boot
server.port=8081
